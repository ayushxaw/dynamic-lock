# Bluetooth proximity is the default. Pair the phone in Ubuntu Settings → Bluetooth.
BACKEND=bluetooth
# Run ~/.local/bin/dynamic_lock.sh --setup after pairing.
# Setup selects one paired phone and stores its address only in this private file.
PHONE_ADDRESS=

# Classic CONNECTION RSSI, relative to the controller's preferred range, NOT dBm.
# Zero is valid. There is no learned or drifting baseline.
RSSI_NEAR_THRESHOLD=-5
RSSI_AWAY_THRESHOLD=-10
RSSI_STALE_SECONDS=15
POLL_SECONDS=5
AWAY_CONFIRM_SECONDS=30
RETURN_CONFIRM_SECONDS=5
IDLE_AFTER_SECONDS=1

# Optional lock executable and arguments, parsed without a shell.
# LOCK_CMD=loginctl lock-session

# Optional network-disconnect fallback; this does not measure physical proximity.
# BACKEND=gsconnect
# GSCONNECT_DEVICE_ID=
# GSCONNECT_DEVICE_NAME=
# STATUS_STALE_SECONDS=15
