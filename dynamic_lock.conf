# Pair your phone in Ubuntu Settings → Bluetooth, then set its address here.
# Find paired addresses with: bluetoothctl devices Paired
PHONE_ADDRESS=

# Trigger the away timer after RSSI falls this many dB below its learned near baseline.
RSSI_DROP_DB=10
# A missing RSSI report counts as away only after this many seconds.
RSSI_STALE_SECONDS=15

# Low-rate monitor/state check interval; RSSI reports arrive over BlueZ D-Bus.
POLL_SECONDS=5
AWAY_CONFIRM_SECONDS=30
RETURN_CONFIRM_SECONDS=5

# Match Windows' idle gate: lock only after the GNOME session has had no input.
# Increase this to require longer idleness. Zero means any reported idle time.
IDLE_AFTER_SECONDS=1

# Optional custom lock executable and arguments. Parsed as arguments (no shell).
# LOCK_CMD=loginctl lock-session
