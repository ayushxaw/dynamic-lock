# Pair the phone in Ubuntu Settings → Bluetooth. Keep its address private.
# Local-only listing: bluetoothctl devices Paired
PHONE_ADDRESS=

# Classic CONNECTION RSSI, relative to the receiver's preferred range, NOT dBm.
# Zero is valid. No baseline is learned. Tune only after near/away dry-runs.
RSSI_NEAR_THRESHOLD=-5
RSSI_AWAY_THRESHOLD=-10
# Readings expire to UNKNOWN, never to departure.
RSSI_STALE_SECONDS=15

# One connection measurement per interval; no continuous discovery scan.
POLL_SECONDS=5
AWAY_CONFIRM_SECONDS=30
RETURN_CONFIRM_SECONDS=5
IDLE_AFTER_SECONDS=1

# Optional executable and arguments. No shell expansion. GNOME confirms the lock.
# LOCK_CMD=loginctl lock-session
